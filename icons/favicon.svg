<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <clipPath id="r"><rect width="512" height="512" rx="114"/></clipPath>
  <radialGradient id="field" cx="42%" cy="38%" r="80%">
    <stop offset="0" stop-color="#2E50DA"/><stop offset=".6" stop-color="#2141BE"/><stop offset="1" stop-color="#162C8C"/>
  </radialGradient>
  <radialGradient id="mal" cx="38%" cy="32%" r="75%">
    <stop offset="0" stop-color="#FFD064"/><stop offset=".55" stop-color="#FFB21E"/><stop offset="1" stop-color="#E5930A"/>
  </radialGradient>
  <radialGradient id="knob" cx="36%" cy="30%" r="80%">
    <stop offset="0" stop-color="#FFE29A"/><stop offset=".5" stop-color="#FFBE33"/><stop offset="1" stop-color="#E08E00"/>
  </radialGradient>
  <radialGradient id="puck" cx="38%" cy="32%" r="80%">
    <stop offset="0" stop-color="#3A3C44"/><stop offset=".55" stop-color="#1A1B21"/><stop offset="1" stop-color="#0B0C10"/>
  </radialGradient>
  <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#E6EDFF" stop-opacity="0"/><stop offset="1" stop-color="#E6EDFF" stop-opacity=".55"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#06103F" flood-opacity=".45"/>
  </filter>
  <filter id="shs" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#06103F" flood-opacity=".5"/>
  </filter>
</defs>
<g clip-path="url(#r)">
  <rect width="512" height="512" fill="url(#field)"/>
  
  <g fill="none" stroke="#F1F4FF" stroke-opacity=".95" stroke-width="11">
    <line x1="-10" y1="256" x2="522" y2="256"/>
    <circle cx="256" cy="256" r="118"/>
  </g>
  <circle cx="256" cy="256" r="12" fill="#F1F4FF"/>
  <!-- puck in flight -->
  <path d="M 214 300 L 318 186 L 342 206 Z" fill="url(#streak)" opacity=".8"/>
  <g filter="url(#shs)">
    <circle cx="338" cy="182" r="56" fill="url(#puck)"/>
    <circle cx="338" cy="182" r="37" fill="none" stroke="#2C2E36" stroke-width="5"/>
    <path d="M 300 160 A 44 44 0 0 1 330 136" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
  <!-- mallet -->
  <g filter="url(#sh)">
    <circle cx="196" cy="330" r="98" fill="url(#mal)"/>
    <circle cx="196" cy="330" r="98" fill="none" stroke="#C97C00" stroke-opacity=".5" stroke-width="5"/>
    <circle cx="196" cy="330" r="66" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="4"/>
    <circle cx="196" cy="330" r="40" fill="url(#knob)"/>
    <ellipse cx="181" cy="314" rx="15" ry="10" fill="#FFFFFF" fill-opacity=".6" transform="rotate(-35 181 314)"/>
    <path d="M 128 286 A 80 80 0 0 1 176 252" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</g>
</svg>